[package]
name = "dijo-pdf"
publish = false
version = "0.2.13"
edition = "2021"
description = "dijo's native parsers of PDF documents and of TrueType and AFM fonts"
license = "Apache-2.0"
repository = "https://github.com/stubbedev/dijo"
authors = ["Alexander Bugge Stage <hello@stubbe.dev>"]

[features]
# What the tests of the crates built on this one share with its own.
testing = ["dijo-base/testing"]

[dependencies]
dijo-base = { path = "../dijo-base", default-features = false }
dijo-image = { path = "../dijo-image", default-features = false }
arrayvec = "0.7.8"
flate2 = "1.1.5"
hayro-ccitt = "0.4.0"
hayro-jbig2 = "0.3.1"
image = { version = "0.25.10", default-features = false, features = ["png", "tiff", "webp", "bmp", "gif", "pnm", "tga", "jpeg"] }
lopdf = { version = "0.46.0", default-features = false }
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz"] }
md-5 = "0.11.0"
memchr = "2.8.3"
png = "0.18.1"
rc4 = "0.2.0"
tar = { version = "0.4.46", default-features = false }
unicode-bidi = "0.3.18"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"
unicode-script = "0.5.8"

[dev-dependencies]
dijo-base = { path = "../dijo-base", default-features = false, features = ["testing"] }
dijo-core = { path = "../dijo-core", default-features = false, features = ["testing"] }
