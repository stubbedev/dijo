[workspace]
resolver = "2"
members = [
    "extractous-base",
    "extractous-native",
    "extractous-mime",
    "extractous-html",
    "extractous-image",
    "extractous-pdf",
    "extractous-media",
    "extractous-odf",
    "extractous-small",
    "extractous-science",
    "extractous-mail",
    "extractous-office",
    "extractous-ooxml",
    "extractous-core",
    "extractous-cli",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

