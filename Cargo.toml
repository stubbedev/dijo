[workspace]
resolver = "2"
members = [
    "dijo-base",
    "dijo-native",
    "dijo-mime",
    "dijo-html",
    "dijo-image",
    "dijo-pdf",
    "dijo-media",
    "dijo-odf",
    "dijo-small",
    "dijo-science",
    "dijo-mail",
    "dijo-office",
    "dijo-ooxml",
    "dijo-core",
    "dijo-cli",
]
exclude = ["vendor/rten"]

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# rav1d decodes damaged streams with the wrapping arithmetic of dav1d, as the release build does.
[profile.dev.package.rav1d]
overflow-checks = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release.build-override]
opt-level = 3


[patch.crates-io]
# rav1d 1.1.0 panics through its C API, aborting the process, when a damaged frame fails before
# its header is read; the fix (memorysafety/rav1d 6c6f4637) is not yet released (#313).
rav1d = { git = "https://github.com/memorysafety/rav1d", rev = "6c6f463785a546dea18fd9ca0f14634c2ee0557c" }
# vendor/rten is rten 0.28.0 from crates.io with two patches, until rten releases them: a
# contiguous stride-1 path in src/ops/conv/depthwise.rs, because rustc 1.99 (LLVM 23) compiles the
# portable loop to twice the instructions LLVM 21 did, making PP-OCR pages 18-28% slower; and a
# buffer pool (src/buffer_pool.rs) that frees the buffers too small for an allocation it misses,
# which 0.28's fused graphs otherwise keep beside the new one, about 13 MB of peak RSS.
rten = { path = "vendor/rten" }
