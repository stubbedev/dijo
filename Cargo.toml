[workspace]
resolver = "2"
members = [
    "extractous-base",
    "extractous-native",
    "extractous-tika",
    "extractous-mime",
    "extractous-core",
    "extractous-cli",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.parity]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug-assertions = true
overflow-checks = true
