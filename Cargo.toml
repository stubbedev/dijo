[workspace]
resolver = "2"
members = [
    "dijo-base",
    "dijo-native",
    "dijo-mime",
    "dijo-html",
    "dijo-image",
    "dijo-pdf",
    "dijo-media",
    "dijo-odf",
    "dijo-small",
    "dijo-science",
    "dijo-mail",
    "dijo-office",
    "dijo-ooxml",
    "dijo-core",
    "dijo-cli",
]

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

