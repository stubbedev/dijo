name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml, .github/actions/**, flake.nix, flake.lock, ci/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-linux
          - os: ubuntu-22.04-arm
            target: aarch64-linux
          - os: macos-15
            target: aarch64-macos
          - os: windows-2025
            target: x86_64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Install Ninja and NASM, which vcpkg builds with on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update --quiet && sudo apt-get install --yes --no-install-recommends ninja-build nasm
      - uses: ./.github/actions/ocr-bundle
        id: ocr
      - name: Embed the OCR bundle
        env:
          BUNDLE: ${{ steps.ocr.outputs.dir }}
        run: echo "EXTRACTOUS_OCR_BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
      - name: Build
        if: runner.os != 'Windows'
        run: cargo build --release --locked --package extractous
      - name: Build
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release --locked --package extractous
      - name: Smoke test, including OCR
        run: |
          binary=target/release/extractous
          "$binary" --version
          "$binary" --licenses > "$RUNNER_TEMP/licenses.txt"
          "$binary" test_files/documents/simple.odt | grep -q "These are a few of my favorite things"
          "$binary" detect test_files/documents/2022_Q3_AAPL.pdf | grep -qx "application/pdf"
          "$binary" --ocr always test_files/documents/eng-ocr.pdf | tr -s '[:space:]' ' ' | grep -qi "the"
          "$binary" quality/corpus/arabic-scan-300dpi.png | grep -q "المنارة"
          "$binary" --metadata quality/corpus/prose-scan-150dpi.png 2>&1 >/dev/null \
            | grep -qx "tk:parsed-by: extractous::PreparingOcrParser"
          "$binary" test_files/documents/photo.heic | grep -q "Lighthouse"
          grep -q "## tesseract" "$RUNNER_TEMP/licenses.txt"
      - name: Check that the Windows executable carries the Visual C++ runtime it needs
        if: runner.os == 'Windows'
        run: |
          unpacked=$(find "$(cygpath --unix "$LOCALAPPDATA")/extractous" -mindepth 1 -maxdepth 1 -type d ! -name '.*')
          status=0
          while IFS= read -r -d '' file; do
            while read -r dll; do
              if [ -z "$(find "$unpacked" -maxdepth 1 -iname "$dll")" ]; then
                echo "$file needs $dll, which Windows does not include and is not unpacked beside it" >&2
                status=1
              fi
            done < <(llvm-objdump -p "$file" | tr -d '\r' | sed -n 's/^ *DLL Name: //p' | grep -iE '^(vcruntime|msvcp|vcomp|concrt)')
          done < <(find target/release/extractous.exe "$unpacked" -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
          exit "$status"
      - name: Smoke test in a container with no tesseract
        if: runner.os == 'Linux'
        run: |
          image=debian:bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587
          bare() {
            docker run --rm --volume "$PWD/target/release/extractous:/extractous:ro" \
              --volume "$PWD/test_files/documents:/documents:ro" --volume "$PWD/quality/corpus:/corpus:ro" \
              "$image" /extractous "$@"
          }
          bare --ocr always /documents/eng-ocr.pdf > "$RUNNER_TEMP/english.txt"
          tr -s '[:space:]' ' ' < "$RUNNER_TEMP/english.txt" | grep -qi "the"
          bare /corpus/arabic-scan-300dpi.png > "$RUNNER_TEMP/arabic.txt"
          grep -q "المنارة" "$RUNNER_TEMP/arabic.txt"
          bare /documents/photo.heic > "$RUNNER_TEMP/heic.txt"
          grep -q "Lighthouse" "$RUNNER_TEMP/heic.txt"
          bare --licenses > "$RUNNER_TEMP/bundled-licenses.txt"
          grep -q "## tesseract" "$RUNNER_TEMP/bundled-licenses.txt"
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version="${GITHUB_SHA::7}"; fi
          name="extractous-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          cp "target/release/extractous$suffix" LICENSE README.md "dist/$name/"
          "target/release/extractous$suffix" --licenses > "dist/$name/LICENSES.md"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*

  static:
    name: static (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-linux-static
          - os: ubuntu-24.04-arm
            target: aarch64-linux-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      BINARY: result-static/bin/extractous
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build with Crane
        run: nix build --print-build-logs --out-link result-static .#static
      - name: Check that it is statically linked
        run: |
          file "$BINARY"
          file "$BINARY" | grep -qE "statically linked|static-pie linked"
          if readelf --program-headers "$BINARY" | grep -q INTERP; then
            echo "$BINARY asks for a dynamic loader" >&2
            exit 1
          fi
          if readelf --dynamic "$BINARY" | grep -q NEEDED; then
            echo "$BINARY needs shared libraries" >&2
            exit 1
          fi
      - name: Smoke test, including OCR
        run: |
          "$BINARY" --version
          "$BINARY" --licenses > "$RUNNER_TEMP/licenses.txt"
          "$BINARY" test_files/documents/simple.odt | grep -q "These are a few of my favorite things"
          "$BINARY" detect test_files/documents/2022_Q3_AAPL.pdf | grep -qx "application/pdf"
          "$BINARY" --ocr always test_files/documents/eng-ocr.pdf | tr -s '[:space:]' ' ' | grep -qi "the"
          "$BINARY" quality/corpus/arabic-scan-300dpi.png | grep -q "المنارة"
          grep -q "## tesseract" "$RUNNER_TEMP/licenses.txt"
          "$BINARY" --format json quality/corpus/danish-scan.png > "$RUNNER_TEMP/danish.json"
          grep -q '"code":"dan"' "$RUNNER_TEMP/danish.json"
          grep -q "tusmørket" "$RUNNER_TEMP/danish.json"
          "$BINARY" quality/corpus/ukrainian-scan.png | grep -q "ДЕКЛАРАЦІЯ"
          "$BINARY" quality/corpus/georgian-scan.png | grep -q "დეკლარაცია"
      - name: Smoke test in an empty container
        run: |
          context="$RUNNER_TEMP/scratch"
          mkdir -p "$context"
          cp "$BINARY" "$context/"
          printf 'FROM scratch\nCOPY extractous /extractous\nENTRYPOINT ["/extractous"]\n' > "$context/Dockerfile"
          docker build --quiet --tag extractous-static "$context"
          bare() {
            docker run --rm --env HOME=/ --tmpfs /tmp --volume "$PWD/test_files/documents:/documents:ro" \
              --volume "$PWD/quality/corpus:/corpus:ro" extractous-static "$@"
          }
          bare --ocr always /documents/eng-ocr.pdf > "$RUNNER_TEMP/english.txt"
          tr -s '[:space:]' ' ' < "$RUNNER_TEMP/english.txt" | grep -qi "the"
          bare /corpus/arabic-scan-300dpi.png > "$RUNNER_TEMP/arabic.txt"
          grep -q "المنارة" "$RUNNER_TEMP/arabic.txt"
          bare --jobs 4 /corpus/danish.docx /corpus/swedish.pdf /corpus/norwegian.docx /corpus/prose.rtf \
            > "$RUNNER_TEMP/batch.txt"
          grep -q "Fyrvokterens loggbok" "$RUNNER_TEMP/batch.txt"
          for image in prose-scan.heic prose-scan.avif prose-scan.djvu; do
            bare "/corpus/$image" | grep -q "Lighthouse Keeper"
          done
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version="${GITHUB_SHA::7}"; fi
          name="extractous-${version}-$TARGET"
          mkdir -p "dist/$name"
          cp "$BINARY" LICENSE README.md "dist/$name/"
          "$BINARY" --licenses > "dist/$name/LICENSES.md"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*

  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: just sbom
        run: devenv shell -- just sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: target/sbom/*

  container:
    name: container (${{ matrix.static }})
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            static: x86_64-linux-static
          - os: ubuntu-24.04-arm
            arch: arm64
            static: aarch64-linux-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.static }}
          path: ${{ runner.temp }}/static
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the image around the static executable
        run: |
          tar -xzf "$RUNNER_TEMP"/static/*.tar.gz -C "$RUNNER_TEMP/static"
          docker load --input "$(ci/container.sh "$RUNNER_TEMP"/static/extractous-*/extractous)"
      - name: Smoke test, including OCR
        run: |
          docker run --rm extractous:local --version
          docker run --rm --volume "$PWD/test_files/documents:/data:ro" extractous:local /data/simple.odt \
            | grep -q "These are a few of my favorite things"
          docker run --rm --volume "$PWD/test_files/documents:/data:ro" extractous:local --ocr always /data/eng-ocr.pdf \
            | tr -s '[:space:]' ' ' | grep -qi "the"
          docker run --rm --volume "$PWD/quality/corpus:/data:ro" extractous:local /data/danish-scan.png \
            | grep -q "tusmørket"
      - name: Check that nothing is written outside the cache and temporary directories
        run: |
          docker run --rm --read-only --tmpfs /tmp --tmpfs /var/cache/extractous:uid=10001,gid=10001 \
            --volume "$PWD/quality/corpus:/data:ro" extractous:local --jobs 2 \
            /data/danish-scan.png /data/prose-scan.heic /data/report.docx > "$RUNNER_TEMP/read-only.txt"
          grep -q "tusmørket" "$RUNNER_TEMP/read-only.txt"
          grep -q "Lighthouse Keeper" "$RUNNER_TEMP/read-only.txt"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push, tagged with the version and architecture, and record the digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY:${GITHUB_REF_NAME#v}-$ARCH"
          docker tag extractous:local "$image"
          docker push "$image"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#*@sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: container-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*

  container-publish:
    needs: container
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: container-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-platform image
        id: publish
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY"
          version="${GITHUB_REF_NAME#v}"
          sources=()
          for digest in "$RUNNER_TEMP"/digests/*; do
            sources+=("$image@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create --tag "$image:$version" --tag "$image:latest" "${sources[@]}"
          echo "digest=$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [build, static, sbom]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
