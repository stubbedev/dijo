name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml, Dockerfile, .dockerignore, ci/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-linux
            graalvm: linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-linux
            graalvm: linux-aarch64
          - os: macos-15
            target: aarch64-macos
            graalvm: macos-aarch64
          - os: windows-2025
            target: x86_64-windows
            graalvm: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GraalVM
        run: |
          if [ "${{ runner.os }}" = Windows ]; then
            home=$(cygpath --windows "$(ci/install-graalvm.sh ${{ matrix.graalvm }} "$(cygpath --unix "$RUNNER_TEMP")/graalvm")")
          else
            home=$(ci/install-graalvm.sh ${{ matrix.graalvm }} "$RUNNER_TEMP/graalvm")
          fi
          echo "GRAALVM_HOME=$home" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        if: runner.os == 'Linux'
      - name: Bundle tesseract and its language data
        if: runner.os == 'Linux'
        run: |
          ci/ocr-bundle.sh "$RUNNER_TEMP/ocr-bundle"
          echo "EXTRACTOUS_OCR_BUNDLE=$RUNNER_TEMP/ocr-bundle" >> "$GITHUB_ENV"
      - name: Install tesseract for the smoke test
        if: runner.os != 'Linux'
        run: |
          case "${{ runner.os }}" in
            macOS) brew install tesseract ;;
            Windows)
              choco install tesseract --no-progress -y
              echo "C:\\Program Files\\Tesseract-OCR" >> "$GITHUB_PATH"
              export PATH="/c/Program Files/Tesseract-OCR:$PATH"
              ;;
          esac
          tesseract --version
      - name: Build
        if: runner.os != 'Windows'
        run: cargo build --release --locked --package extractous
      - name: Build
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release --locked --package extractous
      - name: Smoke test, including OCR
        run: |
          binary=target/release/extractous
          "$binary" --version
          "$binary" --licenses > "$RUNNER_TEMP/licenses.txt"
          grep -q "org.apache.tika:tika-core" "$RUNNER_TEMP/licenses.txt"
          "$binary" test_files/documents/simple.odt | grep -q "These are a few of my favorite things"
          "$binary" detect test_files/documents/2022_Q3_AAPL.pdf | grep -qx "application/pdf"
          "$binary" --ocr always test_files/documents/eng-ocr.pdf | tr -s '[:space:]' ' ' | grep -qi "the"
      - name: Smoke test in a container with no tesseract
        if: runner.os == 'Linux'
        run: |
          image=debian:bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587
          bare() {
            docker run --rm --volume "$PWD/target/release/extractous:/extractous:ro" \
              --volume "$PWD/test_files/documents:/documents:ro" --volume "$PWD/quality/corpus:/corpus:ro" \
              "$image" /extractous "$@"
          }
          bare --ocr always /documents/eng-ocr.pdf > "$RUNNER_TEMP/english.txt"
          tr -s '[:space:]' ' ' < "$RUNNER_TEMP/english.txt" | grep -qi "the"
          bare /corpus/arabic-scan-300dpi.png > "$RUNNER_TEMP/arabic.txt"
          grep -q "المنارة" "$RUNNER_TEMP/arabic.txt"
          bare --licenses > "$RUNNER_TEMP/bundled-licenses.txt"
          grep -q "## tesseract" "$RUNNER_TEMP/bundled-licenses.txt"
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version="${GITHUB_SHA::7}"; fi
          name="extractous-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          cp "target/release/extractous$suffix" LICENSE README.md "dist/$name/"
          "target/release/extractous$suffix" --licenses > "dist/$name/LICENSES.md"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*

  static:
    name: static (x86_64-linux-static)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GraalVM
        run: |
          home=$(ci/install-graalvm.sh linux-x64 "$RUNNER_TEMP/graalvm")
          echo "GRAALVM_HOME=$home" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Bundle tesseract and its language data
        run: |
          ci/ocr-bundle.sh "$RUNNER_TEMP/ocr-bundle"
          echo "EXTRACTOUS_OCR_BUNDLE=$RUNNER_TEMP/ocr-bundle" >> "$GITHUB_ENV"
      - name: Build
        run: ci/static-image.sh target/static-image/extractous
      - name: Check that it is statically linked
        run: |
          binary=target/static-image/extractous
          file "$binary"
          file "$binary" | grep -q "statically linked"
          if readelf --program-headers "$binary" | grep -q INTERP; then
            echo "$binary asks for a dynamic loader" >&2
            exit 1
          fi
          if readelf --dynamic "$binary" | grep -q NEEDED; then
            echo "$binary needs shared libraries" >&2
            exit 1
          fi
      - name: Smoke test, including OCR
        run: |
          binary=target/static-image/extractous
          "$binary" --version
          "$binary" --licenses > "$RUNNER_TEMP/licenses.txt"
          grep -q "org.apache.tika:tika-core" "$RUNNER_TEMP/licenses.txt"
          "$binary" test_files/documents/simple.odt | grep -q "These are a few of my favorite things"
          "$binary" detect test_files/documents/2022_Q3_AAPL.pdf | grep -qx "application/pdf"
          "$binary" --ocr always test_files/documents/eng-ocr.pdf | tr -s '[:space:]' ' ' | grep -qi "the"
          "$binary" --format json quality/corpus/danish-scan.png > "$RUNNER_TEMP/danish.json"
          grep -q '"code":"dan"' "$RUNNER_TEMP/danish.json"
          grep -q "tusmørket" "$RUNNER_TEMP/danish.json"
      - name: Smoke test in an empty container
        run: |
          context="$RUNNER_TEMP/scratch"
          mkdir -p "$context"
          cp target/static-image/extractous "$context/"
          printf 'FROM scratch\nCOPY extractous /extractous\nENTRYPOINT ["/extractous"]\n' > "$context/Dockerfile"
          docker build --quiet --tag extractous-static "$context"
          bare() {
            docker run --rm --env HOME=/ --tmpfs /tmp --volume "$PWD/test_files/documents:/documents:ro" \
              --volume "$PWD/quality/corpus:/corpus:ro" extractous-static "$@"
          }
          bare --ocr always /documents/eng-ocr.pdf > "$RUNNER_TEMP/english.txt"
          tr -s '[:space:]' ' ' < "$RUNNER_TEMP/english.txt" | grep -qi "the"
          bare /corpus/arabic-scan-300dpi.png > "$RUNNER_TEMP/arabic.txt"
          grep -q "المنارة" "$RUNNER_TEMP/arabic.txt"
          bare --jobs 4 /corpus/danish.docx /corpus/swedish.pdf /corpus/norwegian.docx /corpus/prose.rtf \
            > "$RUNNER_TEMP/batch.txt"
          grep -q "Fyrvokterens loggbok" "$RUNNER_TEMP/batch.txt"
          for image in prose-scan.heic prose-scan.avif prose-scan.djvu; do
            bare "/corpus/$image" | grep -q "Lighthouse Keeper"
          done
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; else version="${GITHUB_SHA::7}"; fi
          name="extractous-${version}-x86_64-linux-static"
          mkdir -p "dist/$name"
          cp target/static-image/extractous LICENSE README.md "dist/$name/"
          target/static-image/extractous --licenses > "dist/$name/LICENSES.md"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x86_64-linux-static
          path: dist/*

  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: just sbom
        run: devenv shell -- just sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: target/sbom/*

  container:
    name: container (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact: container-amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: container-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: extractous:smoke-test
      - name: Smoke test, including OCR
        run: |
          docker run --rm extractous:smoke-test --version
          docker run --rm --volume "$PWD/test_files/documents:/data:ro" extractous:smoke-test /data/simple.odt \
            | grep -q "These are a few of my favorite things"
          docker run --rm --volume "$PWD/test_files/documents:/data:ro" extractous:smoke-test --ocr always /data/eng-ocr.pdf \
            | tr -s '[:space:]' ' ' | grep -qi "the"
          docker run --rm --volume "$PWD/quality/corpus:/data:ro" extractous:smoke-test /data/danish-scan.png \
            | grep -q "tusmørket"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        id: push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
      - name: Record the digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*

  container-publish:
    needs: container
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: container-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-platform image
        id: publish
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY"
          version="${GITHUB_REF_NAME#v}"
          sources=()
          for digest in "$RUNNER_TEMP"/digests/*; do
            sources+=("$image@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create --tag "$image:$version" --tag "$image:latest" "${sources[@]}"
          echo "digest=$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [build, static, sbom]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
