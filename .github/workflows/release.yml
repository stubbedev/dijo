name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-linux
          - os: ubuntu-22.04-arm
            target: aarch64-linux
          - os: macos-15
            target: aarch64-macos
          - os: windows-2025
            target: x86_64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: "25"
          distribution: graalvm-community
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Install tesseract for the smoke test
        run: |
          case "${{ runner.os }}" in
            Linux) sudo apt-get update && sudo apt-get install -y tesseract-ocr ;;
            macOS) brew install tesseract ;;
            Windows)
              choco install tesseract --no-progress -y
              echo "C:\\Program Files\\Tesseract-OCR" >> "$GITHUB_PATH"
              ;;
          esac
      - name: Build
        if: runner.os != 'Windows'
        run: cargo build --release --locked --package extractous
      - name: Build
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release --locked --package extractous
      - name: Smoke test, including OCR
        run: |
          binary=target/release/extractous
          "$binary" --version
          "$binary" --licenses | grep -q "org.apache.tika:tika-core"
          "$binary" test_files/documents/simple.odt | grep -q "These are a few of my favorite things"
          "$binary" detect test_files/documents/2022_Q3_AAPL.pdf | grep -qx "application/pdf"
          "$binary" --ocr always test_files/documents/eng-ocr.pdf | tr -s '[:space:]' ' ' | grep -qi "the"
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="extractous-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          cp "target/release/extractous$suffix" LICENSE README.md THIRD-PARTY-LICENSES.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*

  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: just sbom
        run: devenv shell -- just sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: target/sbom/*

  publish:
    needs: [build, sbom]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
