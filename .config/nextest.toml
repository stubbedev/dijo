[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups]
ocr = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/ocr|png/)'
test-group = 'ocr'

[[profile.default.overrides]]
filter = 'binary(large)'
slow-timeout = { period = "60s", terminate-after = 30 }

[[profile.default.overrides]]
filter = 'binary(quality)'
test-group = 'ocr'

[[profile.default.overrides]]
filter = 'binary(fuzz)'
slow-timeout = { period = "60s", terminate-after = 60 }
