[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups]
ocr = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/ocr|png/)'
test-group = 'ocr'

[[profile.default.overrides]]
filter = 'binary_id(dijo::integration) & test(/^large::/)'
slow-timeout = { period = "60s", terminate-after = 30 }

[[profile.default.overrides]]
filter = 'test(/many_shared_strings/)'
slow-timeout = { period = "60s", terminate-after = 30 }

[[profile.default.overrides]]
filter = 'binary_id(dijo::integration) & test(/^quality::/)'
test-group = 'ocr'

[[profile.default.overrides]]
filter = 'binary_id(dijo::integration) & test(/^(fuzz|bench|conformance|soak|server_compare)::/)'
slow-timeout = { period = "60s", terminate-after = 60 }

[[profile.default.overrides]]
filter = 'test(/tikas_(test_)?documents|conformance_documents/)'
slow-timeout = { period = "60s", terminate-after = 40 }
