[package]
name = "extractous"
version = "0.2.1"
edition = "2021"
publish = false
description = "Command-line text and metadata extraction for PDF, Office, email and many other formats"
license = "Apache-2.0"
repository = "https://github.com/stubbedev/extractous"
authors = ["Alexander Bugge Stage <hello@stubbe.dev>"]

[[bin]]
name = "extractous"
path = "src/main.rs"

[dependencies]
extractous-core = { path = "../extractous-core" }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde_json = "1.0.154"
walkdir = "2.5.0"
