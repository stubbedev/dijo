[package]
name = "extractous"
version = "0.2.1"
edition = "2021"
publish = false
description = "Command-line text and metadata extraction for PDF, Office, email and many other formats"
license = "Apache-2.0"
repository = "https://github.com/stubbedev/extractous"
authors = ["Alexander Bugge Stage <hello@stubbe.dev>"]

[features]
# Link into the statically linked Linux executable instead of loading Tika as a shared library;
# ci/static-image.sh builds it.
static-image = ["extractous-core/static-image"]

[[bin]]
name = "extractous"
path = "src/main.rs"

[dependencies]
extractous-core = { path = "../extractous-core" }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
jiff = "0.2.38"
blake3 = "1.8.7"
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-graceful", "http1"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "time", "signal", "fs", "sync", "macros", "io-util"] }
walkdir = "2.5.0"
quick-xml = "0.42.0"
unicode-normalization = "0.1.25"
unicode-general-category = "1.1.0"
unicode-script = "0.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
crc32fast = "1.5.2"
jsonschema = { version = "0.58.6", default-features = false }
