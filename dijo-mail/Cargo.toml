[package]
name = "dijo-mail"
publish = false
version = "0.2.6"
edition = "2021"
description = "dijo's native parsers of mail, archives, web archives, CMS and SQLite"
license = "Apache-2.0"
repository = "https://github.com/stubbedev/dijo"
authors = ["Alexander Bugge Stage <hello@stubbe.dev>"]

[features]
# What the tests of the crates built on this one share with its own.
testing = ["dijo-base/testing"]

[dependencies]
dijo-base = { path = "../dijo-base", default-features = false }
dijo-html = { path = "../dijo-html", default-features = false }
dijo-mime = { path = "../dijo-mime", default-features = false }
ar = "0.9.0"
cpio = "0.4.1"
flate2 = "1.1.5"
memchr = "2.8.3"
regex = "1.13.1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "column_decltype", "serialize"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
dijo-base = { path = "../dijo-base", default-features = false, features = ["testing"] }
dijo-core = { path = "../dijo-core", default-features = false, features = ["testing"] }
dijo-small = { path = "../dijo-small", default-features = false, features = ["testing"] }
tar = { version = "0.4.46", default-features = false }
