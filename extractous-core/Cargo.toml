[package]
name = "extractous-core"
publish = false
version = "0.2.1"
edition = "2021"

description = "Text and metadata extraction for PDF, Office, email and many other formats, using Apache Tika compiled to native code with GraalVM"
license = "Apache-2.0"
repository = "https://github.com/stubbedev/extractous"
authors = ["Alexander Bugge Stage <hello@stubbe.dev>"]
readme = "../README.md"
keywords = ["unstructured", "tika", "text", "pdf", "parser"]
categories = ["parsing", "text-processing"]

[[bench]]
name = "extractor"
harness = false
required-features = []

[dependencies]
libc = { version = "0.2.178" }
jni = { version = "0.21.1" }
libloading = "0.8.9"
flate2 = "1.1.5"
thiserror = { version = "2.0.17" }
bytemuck =  { version = "1.24.0"}
# String enums
strum = { version = "0.27.2" }
strum_macros = { version = "0.27.2" }

[dev-dependencies]
textdistance = "1.1.1"
test-case = "3.3.1"
criterion = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
quick-xml = { version = "0.38.4", features = ["encoding"] }

[build-dependencies]
walkdir = "2.5.0"
flate2 = "1.1.5"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }

[features]
stream-attachguard = []
