[package]
name = "extractous-core"
publish = false
version = "0.2.1"
edition = "2021"

description = "Text and metadata extraction for PDF, Office, email and many other formats, using Apache Tika compiled to native code with GraalVM"
license = "Apache-2.0"
repository = "https://github.com/stubbedev/extractous"
authors = ["Alexander Bugge Stage <hello@stubbe.dev>"]
keywords = ["unstructured", "tika", "text", "pdf", "parser"]
categories = ["parsing", "text-processing"]

[[bench]]
name = "extractor"
harness = false
required-features = []

# Unpacking embedded documents whole is Tika's path's alone.
[[test]]
name = "extract_embedded_tests"
required-features = ["tika"]

# The cause chains of the exceptions Tika's path throws.
[[test]]
name = "error_tests"
required-features = ["tika"]

[features]
default = ["tika"]
# Apache Tika compiled to native code with GraalVM and run through JNI, which extracts what no
# native parser reads yet. Without it, those documents fail with `Error::Unsupported`, and the
# build needs no GraalVM.
tika = ["extractous-base/tika", "extractous-tika/tika", "extractous-mime/tika", "extractous-html/tika", "extractous-image/tika", "extractous-pdf/tika", "extractous-media/tika", "extractous-odf/tika", "extractous-small/tika", "extractous-mail/tika", "extractous-office/tika", "extractous-ooxml/tika"]
# Link tesseract, Leptonica and libheif statically, as `EXTRACTOUS_STATIC_LIBS` lists them, instead
# of loading them: for the statically linked Linux executable without Tika that ci/static-native.nix builds.
static = ["extractous-native/static", "extractous-tika/static", "extractous-image/static"]
# Build for the statically linked Linux executable with Tika, where this crate is linked into the
# GraalVM native image of Tika and uses the Java VM that image runs, instead of loading the image as
# a shared library: ci/static-image.sh builds it.
static-image = ["static", "tika", "extractous-tika/static-image", "extractous-mail/static-image"]
# The parity harness, which compares the native parsers with Tika's path, for the tests of the crates
# of the formats.
parity = ["extractous-base/testing", "extractous-mime/testing", "extractous-html/testing", "extractous-image/testing", "extractous-pdf/testing", "extractous-media/testing", "extractous-odf/testing", "extractous-small/testing", "extractous-mail/testing", "extractous-office/testing", "extractous-ooxml/testing"]

[dependencies]
extractous-base = { path = "../extractous-base", default-features = false }
extractous-native = { path = "../extractous-native" }
extractous-tika = { path = "../extractous-tika", default-features = false }
extractous-ooxml = { path = "../extractous-ooxml", default-features = false }
extractous-office = { path = "../extractous-office", default-features = false }
extractous-mail = { path = "../extractous-mail", default-features = false }
extractous-small = { path = "../extractous-small", default-features = false }
extractous-odf = { path = "../extractous-odf", default-features = false }
extractous-media = { path = "../extractous-media", default-features = false }
extractous-pdf = { path = "../extractous-pdf", default-features = false }
extractous-image = { path = "../extractous-image", default-features = false }
extractous-html = { path = "../extractous-html", default-features = false }
extractous-mime = { path = "../extractous-mime", default-features = false }
regex = "1.13.1"
png = "0.18.1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
extractous-ooxml = { path = "../extractous-ooxml", default-features = false, features = ["testing"] }
extractous-office = { path = "../extractous-office", default-features = false, features = ["testing"] }
extractous-mail = { path = "../extractous-mail", default-features = false, features = ["testing"] }
extractous-small = { path = "../extractous-small", default-features = false, features = ["testing"] }
extractous-odf = { path = "../extractous-odf", default-features = false, features = ["testing"] }
extractous-media = { path = "../extractous-media", default-features = false, features = ["testing"] }
extractous-pdf = { path = "../extractous-pdf", default-features = false, features = ["testing"] }
extractous-image = { path = "../extractous-image", default-features = false, features = ["testing"] }
extractous-mime = { path = "../extractous-mime", default-features = false, features = ["testing"] }
extractous-base = { path = "../extractous-base", default-features = false, features = ["testing"] }
textdistance = "1.1.1"
test-case = "3.3.1"
criterion = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
quick-xml = { version = "0.42.0", features = ["encoding"] }
