plugins {
    id 'java-library'
    id 'com.github.jk1.dependency-license-report' version '3.1.4'
    id 'org.cyclonedx.bom' version '3.5.1'
    id 'org.graalvm.buildtools.native' version '1.1.14' // Updated for GraalVM 25 and Gradle 9 compatibility
}

import com.github.jk1.license.ProjectData
import com.github.jk1.license.filter.ExcludeDependenciesWithoutArtifactsFilter
import com.github.jk1.license.filter.SpdxLicenseBundleNormalizer
import com.github.jk1.license.render.ReportRenderer

class ThirdPartyLicensesRenderer implements ReportRenderer {

    private static final Set<String> HOLDER_FREE_LICENSES = ['0BSD', 'Apache-2.0'] as Set

    private final File output
    private final File storedTexts

    ThirdPartyLicensesRenderer(File output, File storedTexts) {
        this.output = output
        this.storedTexts = storedTexts
    }

    void render(ProjectData data) {
        def reportDir = new File(data.project.licenseReport.absoluteOutputDir as String)
        def libraryTexts = new TreeMap<String, SortedSet<String>>()
        def table = new StringBuilder()
        def unusedTexts = new TreeSet<String>(storedTexts.list() as List)
        data.allDependencies.sort { "${it.group}:${it.name}:${it.version}" }.each { module ->
            def coordinate = "${module.group}:${module.name}"
            def licenses = (module.poms*.licenses.flatten()*.name + module.manifests*.license)
                    .findAll().unique().sort()
            if (licenses.empty) {
                throw new GradleException("No licence is declared for ${coordinate}:${module.version}")
            }
            table << "| `${coordinate}` | ${module.version} | ${licenses.join(', ')} |\n"
            def shipped = module.licenseFiles*.fileDetails.flatten()
            shipped.each { details ->
                collect(libraryTexts, new File(reportDir, details.file), coordinate)
            }
            if (!shipped.empty) {
                return
            }
            def stored = storedText(module.group)
            if (stored != null) {
                collect(libraryTexts, stored, coordinate)
                unusedTexts.remove(stored.name)
            } else if (!HOLDER_FREE_LICENSES.containsAll(licenses)) {
                throw new GradleException("${coordinate}:${module.version} ships no text of "
                        + "${licenses.join(', ')}; add it as ${storedTexts}/${module.group}.txt")
            }
        }
        if (!unusedTexts.empty) {
            throw new GradleException("${storedTexts} holds texts of no library in the image: "
                    + unusedTexts.join(', '))
        }
        def graalvmTexts = new TreeMap<String, SortedSet<String>>()
        graalvmLegalFiles().each { file -> collect(graalvmTexts, file, file.name) }

        def document = new StringBuilder()
        document << '## Java libraries compiled into libtika_native\n\n'
        document << 'libtika_native is a GraalVM native image. Besides the libraries below, it contains '
        document << 'the GraalVM Community Edition runtime and parts of the OpenJDK class library and '
        document << 'its native libraries, licensed under GPL-2.0-only WITH Classpath-exception-2.0, '
        document << 'which permits distributing the image under the terms of its own licence. Their '
        document << 'licence and the notices of the third-party code they contain follow the '
        document << 'libraries\' texts. Tesseract is not part of the binary; extractous runs an '
        document << 'installed tesseract executable for OCR.\n\n'
        document << '| Library | Version | Declared licences |\n|---|---|---|\n'
        document << table
        document << '\n### Licence and notice texts of the Java libraries\n'
        appendTexts(document, libraryTexts, 'Applies to')
        document << '\n### Licence and notices of the GraalVM runtime and OpenJDK\n'
        appendTexts(document, graalvmTexts, 'Shipped with')
        output.parentFile.mkdirs()
        output.write(document.toString(), 'UTF-8')
    }

    private File storedText(String group) {
        return storedTexts.listFiles()
                .findAll { group == it.name - '.txt' || group.startsWith((it.name - '.txt') + '.') }
                .max { it.name.length() }
    }

    private static List<File> graalvmLegalFiles() {
        def home = System.getenv('GRAALVM_HOME')
        if (!home) {
            throw new GradleException('GRAALVM_HOME must point to the GraalVM that builds the image')
        }
        def legal = new File(home, 'legal')
        def files = []
        legal.eachFileRecurse(groovy.io.FileType.FILES) { files << it }
        if (files.empty) {
            throw new GradleException("${legal} holds no licence files")
        }
        return files.sort { it.path }
    }

    private static void collect(Map<String, SortedSet<String>> texts, File file, String source) {
        def text = file.getText('UTF-8').replace('\r\n', '\n').trim()
        texts.computeIfAbsent(text) { new TreeSet<String>() } << source
    }

    private static void appendTexts(StringBuilder document, Map<String, SortedSet<String>> texts,
                                    String relation) {
        texts.entrySet().sort { it.value.first() }.each { entry ->
            document << "\n${relation} ${entry.value.collect { "`${it}`" }.join(', ')}:\n\n"
            document << "````text\n${entry.key}\n````\n"
        }
    }
}


def tikaVersion = "4.1.0"
def twelveMonkeysVersion = "3.15.2"
def numThreads = Runtime.getRuntime().availableProcessors()
def currentOs = org.gradle.internal.os.OperatingSystem.current()


def osName = ""
if (currentOs.isLinux()) {
    osName = "linux"
} else if (currentOs.isMacOsX()) {
    osName = "macos"
} else if (currentOs.isWindows()) {
    osName = "windows"
}

group = 'ai.yobix'
version = "tika-$tikaVersion-$osName"


repositories {
    mavenCentral()
}

dependencies {
    // Tika uses slf4j, just use a nop logger to ignore all logging
    implementation("org.slf4j:slf4j-nop:2.0.20")
    // Some dependencies use log4j such as poi, route log4j back to slf4j
    // Using latest 2.x version (3.x doesn't exist yet as of Oct 2025)
    implementation 'org.apache.logging.log4j:log4j-to-slf4j:2.26.1'

    // Jakarta Mail API - required for email parsing and GraalVM native-image
    implementation 'jakarta.mail:jakarta.mail-api:2.1.5'
    implementation 'org.eclipse.angus:angus-mail:2.0.5'  // Jakarta Mail implementation

    implementation("org.apache.tika:tika-core:$tikaVersion")
    implementation "org.apache.tika:tika-parsers-standard-package:$tikaVersion" // Apache Tika parsers

    // Core parser modules (comprehensive coverage for all formats)
    implementation("org.apache.tika:tika-parser-microsoft-module:$tikaVersion")      // Office (DOCX, XLSX, PPTX, DOC, XLS, PPT)
    implementation("org.apache.tika:tika-parser-pdf-module:$tikaVersion")             // PDF (fallback)
    implementation("org.apache.tika:tika-parser-html-module:$tikaVersion")            // HTML, XHTML
    implementation("org.apache.tika:tika-parser-apple-module:$tikaVersion")           // iWork (Pages, Numbers, Keynote)
    implementation("org.apache.tika:tika-parser-audiovideo-module:$tikaVersion")      // Media metadata
    implementation("org.apache.tika:tika-parser-cad-module:$tikaVersion")             // CAD (AutoCAD, SolidWorks) - UNUSUAL GOLD
    implementation("org.apache.tika:tika-parser-crypto-module:$tikaVersion")          // Encrypted/password-protected - PRIORITY
    implementation("org.apache.tika:tika-parser-font-module:$tikaVersion")            // Font metadata
    implementation("org.apache.tika:tika-parser-mail-module:$tikaVersion")            // Email (EML, MSG, PST, MBOX)
    implementation("org.apache.tika:tika-parser-miscoffice-module:$tikaVersion")      // Legacy (WordPerfect, Lotus, dBase) - LEGACY GOLD
    implementation("org.apache.tika:tika-parser-news-module:$tikaVersion")            // RSS, Atom
    implementation("org.apache.tika:tika-parser-ocr-module:$tikaVersion")             // Tesseract OCR integration
    implementation("org.apache.tika:tika-parser-pkg-module:$tikaVersion")             // Archives (ZIP, TAR, 7Z, RAR, etc.)
    implementation("org.apache.tika:tika-parser-text-module:$tikaVersion")            // Text variants
    implementation("org.apache.tika:tika-parser-xml-module:$tikaVersion")             // XML variants
    implementation("org.apache.tika:tika-parser-webarchive-module:$tikaVersion")      // WARC web archives

    // Additional modules for comprehensive coverage
    implementation("org.apache.tika:tika-parser-code-module:$tikaVersion")            // Source code files
    implementation("org.apache.tika:tika-parser-sqlite3-module:$tikaVersion")         // SQLite databases

    // ImageIO decoders for images Tika and tesseract cannot decode, so that they can be OCRed
    implementation("com.twelvemonkeys.imageio:imageio-psd:$twelveMonkeysVersion")
    implementation("com.twelvemonkeys.imageio:imageio-pcx:$twelveMonkeysVersion")
    implementation("com.twelvemonkeys.imageio:imageio-tga:$twelveMonkeysVersion")
}

licenseReport {
    configurations = ['runtimeClasspath']
    allowedLicensesFile = file('allowed-licenses.json')
    filters = [new ExcludeDependenciesWithoutArtifactsFilter(), new SpdxLicenseBundleNormalizer()]
    renderers = [new ThirdPartyLicensesRenderer(layout.buildDirectory.file('licenses/java.md').get().asFile,
            file('licenses'))]
}

tasks.named('generateLicenseReport') {
    inputs.dir('licenses')
}

tasks.cyclonedxDirectBom {
    includeConfigs = ['runtimeClasspath']
    jsonOutput = layout.buildDirectory.file('sbom/java.cdx.json')
    xmlOutput.convention((RegularFile) null)
}

tasks.register('nativeImageArguments') {
    dependsOn 'classes', 'generateResourcesConfigFile'
    group = 'build'
    description = 'Prints the native-image arguments of libtika_native, one per line, for ci/static-image.sh'
    doLast {
        def binary = graalvmNative.binaries.main
        println '-cp'
        println sourceSets.main.runtimeClasspath.asPath
        println '-H:ConfigurationFileDirectories=' + binary.configurationFileDirectories.files.join(',')
        binary.buildArgs.get().each { println it }
        binary.jvmArgs.get().each { println it }
    }
}

tasks.register('runAgent', JavaExec) {
    dependsOn classes                      // ensure byte-code is built
    group = 'verification'
    description = 'Runs Tika with the native-image agent to generate GraalVM configs'

    mainClass = 'ai.yobix.AgentRunner'
    classpath = sourceSets.main.runtimeClasspath

    args '../../test_files'

    // --- GraalVM agent  ---------------
    jvmArgs "-agentlib:native-image-agent=config-output-dir=graal-agent"
}

graalvmNative {
    // The merge option didn't work as expected so currently not using it
    // It should work by running `.gradlew -Pagent runAgent` which should generate metadata
    // in the `graal-agent` directory. We should then be able to merge that metadata into the
    // `src/main/resources/META-INF/$group/$version` directory, but the merge didn't include the new metadata.
    // Likely user error.
    // agent {
    //     defaultMode = "standard"
    //     metadataCopy {
    //         mergeWithExisting = true
    //         inputTaskNames.add("runAgent")
    //         outputDirectories.add("src/main/resources/META-INF/$group/$version")
    //     }
    // }
    metadataRepository {
        enabled = true
    }
    // Make sure this is off to use the same GraalVM version thant the one used by gradle
    // Setting the version is left outside of this script in github workflow or developer build environment
    toolchainDetection = false

    // Set to false to disable to run the tests in native mode.
    testSupport = true

    binaries {
        main {
            imageName = 'libtika_native'

            // To build a shared lib, make sure to not set the mainClass
            sharedLibrary = true

            // The --no-fallback option to native-image causes the utility to fail if it can not create the image.
            fallback = false

            configurationFileDirectories.from(file("src/main/resources/META-INF/$group/$version"))

            buildArgs.addAll(
                    "-H:+AddAllCharsets", // Very important to get UTF8 working
                    "--enable-url-protocols=http,https",
                    "--enable-native-access=ALL-UNNAMED",
                    "-H:ExcludeResources=org/sqlite/native/.*",
                    "-Dorg.sqlite.lib.exportPath=${layout.buildDirectory.dir('native/nativeCompile').get().asFile}",
                    "--initialize-at-build-time=ai.yobix.EncodingModels,org.apache.tika.ml.junkdetect.JunkDetector,org.apache.tika.ml.junkdetect.BigramTables,org.apache.tika.ml.chardetect.NaiveBayesBigramEncodingDetector,org.apache.tika.ml.chardetect.NaiveBayesBigramEncodingDetector\$Cohort",
                    "-O3",
                    "--parallelism=$numThreads",
                    "-march=compatibility", // VERY IMPORTANT to use compatibility flag. If not the libs will use the cpu arch of the build machine and will notwork on other CPUs if distributed

                    // GraalVM 25 optimizations
                    // Note: --strict-image-heap is now default in GraalVM 25
                    "-H:+UnlockExperimentalVMOptions",
                    "-H:ServiceLoaderFeatureExcludeServiceProviders=org.apache.poi.xslf.draw.SVGImageRenderer",
                    "-H:+RemoveUnusedSymbols",            // Smaller binary
                    "-H:+ReportExceptionStackTraces"      // Better error messages
            )
            jvmArgs.add('-Djava.awt.headless=true')
            requiredVersion = '25' // Upgraded from 23 for latest GraalVM optimizations
        }
    }
}
