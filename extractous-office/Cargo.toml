[package]
name = "extractous-office"
publish = false
version = "0.2.1"
edition = "2021"
description = "extractous's native parsers of Microsoft Office's binary formats, Outlook and RTF"
license = "Apache-2.0"
repository = "https://github.com/stubbedev/extractous"
authors = ["Alexander Bugge Stage <hello@stubbe.dev>"]

[features]
# Tika's path, which the tests compare the native parsers with, and which takes the embedded
# documents no native parser reads.
tika = ["extractous-base/tika", "extractous-core/tika", "extractous-html/tika", "extractous-mail/tika", "extractous-mime/tika"]
# What the tests of the crates built on this one share with its own.
testing = ["extractous-base/testing"]

[dependencies]
extractous-base = { path = "../extractous-base", default-features = false }
extractous-html = { path = "../extractous-html", default-features = false }
extractous-mail = { path = "../extractous-mail", default-features = false }
extractous-mime = { path = "../extractous-mime", default-features = false }
flate2 = { version = "1.1.5", features = ["zlib-rs"] }
rc4 = "0.2.0"
regex = "1.13.1"

[dev-dependencies]
extractous-base = { path = "../extractous-base", default-features = false, features = ["testing"] }
extractous-core = { path = "../extractous-core", default-features = false, features = ["parity"] }
