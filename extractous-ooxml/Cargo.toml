[package]
name = "extractous-ooxml"
publish = false
version = "0.2.1"
edition = "2021"
description = "extractous's native parsers of Office Open XML and XPS"
license = "Apache-2.0"
repository = "https://github.com/stubbedev/extractous"
authors = ["Alexander Bugge Stage <hello@stubbe.dev>"]

[features]
# What the tests of the crates built on this one share with its own.
testing = ["extractous-base/testing"]

[dependencies]
extractous-base = { path = "../extractous-base", default-features = false }
extractous-image = { path = "../extractous-image", default-features = false }
extractous-mime = { path = "../extractous-mime", default-features = false }
extractous-office = { path = "../extractous-office", default-features = false }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
extractous-base = { path = "../extractous-base", default-features = false, features = ["testing"] }
extractous-core = { path = "../extractous-core", default-features = false, features = ["testing"] }
extractous-image = { path = "../extractous-image", default-features = false, features = ["testing"] }
