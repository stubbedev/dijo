[package]
name = "extractous-tika"
publish = false
version = "0.2.1"
edition = "2021"
description = "extractous's bridge to Apache Tika, compiled to native code with GraalVM and run through JNI"
license = "Apache-2.0"
repository = "https://github.com/stubbedev/extractous"
authors = ["Alexander Bugge Stage <hello@stubbe.dev>"]

[features]
# The bridge itself. Without it, only the process's settings remain, and no GraalVM is needed.
tika = [
    "dep:bytemuck",
    "dep:extractous-native",
    "dep:jni",
    "dep:libloading",
    "dep:windows-sys",
    "extractous-base/tika",
    "extractous-native/tika",
]
static = ["extractous-native?/static"]
static-image = ["static", "tika", "extractous-native/static-image"]

[dependencies]
extractous-base = { path = "../extractous-base", default-features = false }
extractous-native = { path = "../extractous-native", optional = true }
jni = { version = "0.22.4", optional = true }
libloading = { version = "0.9.0", optional = true }
bytemuck = { version = "1.24.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_LibraryLoader"], optional = true }
