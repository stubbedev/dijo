[package]
name = "dijo"
version = "0.2.5"
edition = "2021"
publish = false
description = "Command-line text and metadata extraction for PDF, Office, email and many other formats"
license = "Apache-2.0"
repository = "https://github.com/stubbedev/dijo"
authors = ["Alexander Bugge Stage <hello@stubbe.dev>"]

[features]
# The statically linked Linux executable without Tika, tesseract and libheif linked in;
# ci/static-native.nix builds it (`nix build .#static`).
static = ["dijo-core/static", "dep:mimalloc"]

[[bin]]
name = "dijo"
path = "src/main.rs"

[dependencies]
dijo-core = { path = "../dijo-core", default-features = false }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
jiff = "0.2.38"
blake3 = "1.8.7"
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-graceful", "http1"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "time", "signal", "fs", "sync", "macros", "io-util"] }
walkdir = "2.5.0"
quick-xml = "0.42.0"
unicode-normalization = "0.1.25"
mimalloc = { version = "0.1.52", optional = true, features = ["override"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
crc32fast = "1.5.2"
flate2 = "1.1.5"
jsonschema = { version = "0.59.0", default-features = false }
